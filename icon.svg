<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b726" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#07080f"/>

  <!-- Outer Orbit & Halo -->
  <circle cx="256" cy="256" r="215" fill="#121526" stroke="#f5b726" stroke-width="6" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="170" fill="url(#halo-glow)"/>

  <!-- Golden Crescent Moon -->
  <path d="M 230 110 A 150 150 0 1 0 395 315 A 130 130 0 1 1 230 110 Z" fill="url(#moon-grad)"/>

  <!-- Sloan the Sloth Body -->
  <g transform="translate(190, 190)">
    <!-- Sloth Torso -->
    <ellipse cx="60" cy="70" rx="60" ry="46" fill="#d9b48f" transform="rotate(-15, 60, 70)"/>
    
    <!-- Sloth Head -->
    <ellipse cx="40" cy="40" rx="36" ry="32" fill="#d9b48f"/>
    <!-- Face mask -->
    <ellipse cx="40" cy="42" rx="28" ry="24" fill="#f5ede3"/>
    <!-- Dark eye patches -->
    <ellipse cx="26" cy="40" rx="10" ry="7" fill="#785537" transform="rotate(-10, 26, 40)"/>
    <ellipse cx="54" cy="40" rx="10" ry="7" fill="#785537" transform="rotate(10, 54, 40)"/>
    <!-- Sleeping Eyes -->
    <path d="M 20 40 Q 26 48 32 40" stroke="#26170d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 48 40 Q 54 48 60 40" stroke="#26170d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Nose & Smile -->
    <ellipse cx="40" cy="50" rx="6" ry="4" fill="#322314"/>
    <path d="M 37 54 Q 40 57 43 54" stroke="#322314" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Sloth Sleeping Arms Hugging Moon -->
    <path d="M 60 75 Q 110 50 135 105" stroke="#d9b48f" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- Curved Claws -->
    <path d="M 130 100 Q 140 108 142 118" stroke="#f5ede3" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 135 98 Q 146 106 148 116" stroke="#f5ede3" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 125 102 Q 134 110 136 120" stroke="#f5ede3" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Twinkling Starlight Points -->
  <circle cx="120" cy="140" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="380" cy="140" r="6" fill="#f5b726" opacity="0.8"/>
  <circle cx="140" cy="380" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="360" cy="390" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="260" cy="70" r="5" fill="#f5b726" opacity="0.9"/>

  <!-- Sleep Zzz -->
  <text x="350" y="210" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#fcd34d" opacity="0.85">z</text>
  <text x="380" y="180" font-family="'Outfit', sans-serif" font-weight="800" font-size="38" fill="#f5b726" opacity="0.95">Z</text>
</svg>
