<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none" class="bento-vector-art" aria-hidden="true">
  <defs>
    <linearGradient id="waveGradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b726" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#f5b726" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f5b726" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="waveGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="waveGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f5b726" />
    </linearGradient>
  </defs>

  <!-- Background Acoustic Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="20" y1="20" x2="300" y2="20" />
    <line x1="20" y1="60" x2="300" y2="60" stroke-dasharray="4 4" />
    <line x1="20" y1="100" x2="300" y2="100" />
    <line x1="80" y1="10" x2="80" y2="110" />
    <line x1="160" y1="10" x2="160" y2="110" />
    <line x1="240" y1="10" x2="240" y2="110" />
  </g>

  <!-- Sub-bass Harmonic Wave (Purple - 4.5Hz Delta) -->
  <path d="M10 60 Q50 95 90 60 T170 60 T250 60 T310 60" fill="none" stroke="url(#waveGradPurple)" stroke-width="3" stroke-linecap="round" />

  <!-- Mid Frequency Sound Wave (Cyan - Rain & Breeze) -->
  <path d="M10 60 Q35 25 60 60 T110 60 T160 60 T210 60 T260 60 T310 60" fill="none" stroke="url(#waveGradCyan)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Fundamental Resonant Wave (Amber - 432Hz Solfeggio) -->
  <path d="M10 60 C30 85 45 35 75 60 C105 85 120 35 150 60 C180 85 195 35 225 60 C255 85 270 35 300 60" fill="none" stroke="url(#waveGradAmber)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Resonant Nodes -->
  <g>
    <circle cx="75" cy="60" r="4" fill="url(#nodeGlow)" />
    <circle cx="75" cy="60" r="7" stroke="#f5b726" stroke-width="1" opacity="0.4" />
    
    <circle cx="150" cy="60" r="4.5" fill="url(#nodeGlow)" />
    <circle cx="150" cy="60" r="9" stroke="#f5b726" stroke-width="1" opacity="0.5" />
    <circle cx="150" cy="60" r="14" stroke="#f5b726" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.3" />

    <circle cx="225" cy="60" r="4" fill="url(#nodeGlow)" />
    <circle cx="225" cy="60" r="7" stroke="#f5b726" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Sound Particle Sparks -->
  <circle cx="110" cy="42" r="1.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="190" cy="78" r="1.5" fill="#f5b726" opacity="0.9" />
  <circle cx="260" cy="45" r="1.2" fill="#c084fc" opacity="0.8" />
  <circle cx="40" cy="75" r="1.2" fill="#38bdf8" opacity="0.7" />
</svg>
