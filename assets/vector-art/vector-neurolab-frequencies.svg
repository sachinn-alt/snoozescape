<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none" class="bento-vector-art" aria-hidden="true">
  <defs>
    <linearGradient id="freqDelta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="freqTheta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Ambient Frequency Ripple -->
  <ellipse cx="160" cy="50" rx="130" ry="35" fill="#8b5cf6" opacity="0.08" />

  <!-- Delta Brainwave (Slow, High Amplitude 0.5-4Hz) -->
  <path d="M10 50 C40 10 70 90 100 50 C130 10 160 90 190 50 C220 10 250 90 280 50 C295 30 305 60 315 50" fill="none" stroke="url(#freqDelta)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Theta/Alpha Wave (Rhythmic Entrainment 5-10Hz) -->
  <path d="M10 50 Q25 32 40 50 T70 50 T100 50 T130 50 T160 50 T190 50 T220 50 T250 50 T280 50 T310 50" fill="none" stroke="url(#freqTheta)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Harmonic Focus Dots -->
  <circle cx="100" cy="50" r="3.5" fill="#a78bfa" />
  <circle cx="100" cy="50" r="7" stroke="#a78bfa" stroke-width="1" opacity="0.4" />
  <circle cx="190" cy="50" r="3.5" fill="#2dd4bf" />
  <circle cx="190" cy="50" r="7" stroke="#2dd4bf" stroke-width="1" opacity="0.4" />
  <circle cx="160" cy="50" r="5" fill="#f5b726" />
  <circle cx="160" cy="50" r="10" stroke="#f5b726" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
</svg>
