<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="circadian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hypnogram-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#f5b726"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="sleep-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="circadian-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Pill -->
  <rect width="500" height="110" rx="14" fill="url(#circadian-bg)"/>

  <!-- Horizontal Sleep Stage Reference Guidelines -->
  <!-- Wake / REM (Top) -->
  <line x1="45" y1="28" x2="475" y2="28" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="3 3"/>
  <!-- Light NREM N1/N2 (Middle) -->
  <line x1="45" y1="55" x2="475" y2="55" stroke="rgba(255, 255, 255, 0.06)" stroke-dasharray="3 3"/>
  <!-- Deep Slow-Wave Delta N3 (Bottom) -->
  <line x1="45" y1="82" x2="475" y2="82" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="3 3"/>

  <!-- Left Stage Labels -->
  <text x="12" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#38bdf8" opacity="0.85">REM</text>
  <text x="12" y="58" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8" font-weight="500" fill="#94a3b8" opacity="0.75">LIGHT</text>
  <text x="12" y="85" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8" font-weight="600" fill="#a78bfa" opacity="0.85">DEEP</text>

  <!-- 90-Minute Sleep Cycle Wave (Cycle 1, Cycle 2, Cycle 3, Cycle 4, Cycle 5) -->
  <!-- Wave Shading -->
  <path d="M 50 28 
           C 65 30, 75 52, 90 82 
           C 105 82, 115 78, 128 50 
           C 138 32, 145 28, 155 28
           C 170 30, 180 52, 195 80 
           C 210 80, 220 74, 233 48 
           C 243 30, 250 28, 260 28
           C 275 32, 285 55, 300 76 
           C 315 76, 325 68, 338 45 
           C 348 28, 355 26, 365 26
           C 380 32, 390 56, 405 72 
           C 420 72, 430 60, 443 40 
           C 453 26, 460 24, 470 24
           L 470 95 L 50 95 Z" 
        fill="url(#sleep-fill-grad)"/>

  <!-- Stroke Hypnogram Curve -->
  <path d="M 50 28 
           C 65 30, 75 52, 90 82 
           C 105 82, 115 78, 128 50 
           C 138 32, 145 28, 155 28
           C 170 30, 180 52, 195 80 
           C 210 80, 220 74, 233 48 
           C 243 30, 250 28, 260 28
           C 275 32, 285 55, 300 76 
           C 315 76, 325 68, 338 45 
           C 348 28, 355 26, 365 26
           C 380 32, 390 56, 405 72 
           C 420 72, 430 60, 443 40 
           C 453 26, 460 24, 470 24" 
        fill="none" stroke="url(#hypnogram-grad)" stroke-width="2.6" stroke-linecap="round" filter="url(#circadian-glow)"/>

  <!-- Cycle Boundary Dividers & Optimal Wake Windows -->
  <!-- Cycle 1 (90m) -->
  <line x1="155" y1="16" x2="155" y2="92" stroke="rgba(245, 183, 38, 0.3)" stroke-dasharray="2 2"/>
  <circle cx="155" cy="28" r="4" fill="#f5b726" filter="url(#circadian-glow)"/>
  <text x="155" y="103" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f5b726" text-anchor="middle">1.5h (C1)</text>

  <!-- Cycle 2 (180m / 3h) -->
  <line x1="260" y1="16" x2="260" y2="92" stroke="rgba(245, 183, 38, 0.3)" stroke-dasharray="2 2"/>
  <circle cx="260" cy="28" r="4" fill="#f5b726" filter="url(#circadian-glow)"/>
  <text x="260" y="103" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f5b726" text-anchor="middle">3.0h (C2)</text>

  <!-- Cycle 3 (270m / 4.5h) -->
  <line x1="365" y1="16" x2="365" y2="92" stroke="rgba(245, 183, 38, 0.3)" stroke-dasharray="2 2"/>
  <circle cx="365" cy="26" r="4" fill="#f5b726" filter="url(#circadian-glow)"/>
  <text x="365" y="103" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f5b726" text-anchor="middle">4.5h (C3)</text>

  <!-- Cycle 4 (360m / 6h) - Recommended -->
  <line x1="470" y1="16" x2="470" y2="92" stroke="rgba(52, 211, 153, 0.45)" stroke-dasharray="2 2"/>
  <circle cx="470" cy="24" r="4.5" fill="#34d399" filter="url(#circadian-glow)"/>
  <text x="470" y="103" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">6.0h (★)</text>

  <!-- Deep Sleep Slow-Wave Nodes (Delta peak) -->
  <circle cx="90" cy="82" r="3" fill="#a78bfa"/>
  <circle cx="195" cy="80" r="3" fill="#a78bfa"/>
  <circle cx="300" cy="76" r="3" fill="#a78bfa"/>
  <circle cx="405" cy="72" r="3" fill="#a78bfa"/>
</svg>
