<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" class="bento-vector-art" aria-hidden="true">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f5b726" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="nebulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="slothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Cosmic Nebula Glow -->
  <ellipse cx="160" cy="90" rx="140" ry="75" fill="url(#nebulaGrad)" />

  <!-- Constellation Lines -->
  <g stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.35">
    <line x1="30" y1="40" x2="80" y2="25" />
    <line x1="80" y1="25" x2="130" y2="50" />
    <line x1="220" y1="35" x2="265" y2="20" />
    <line x1="265" y1="20" x2="295" y2="60" />
  </g>

  <!-- Twinkling Starlight Points -->
  <g fill="#f8fafc">
    <circle cx="30" cy="40" r="1.5" opacity="0.8" />
    <circle cx="80" cy="25" r="2" opacity="0.9" />
    <circle cx="130" cy="50" r="1.5" opacity="0.6" />
    <circle cx="220" cy="35" r="1.8" opacity="0.8" />
    <circle cx="265" cy="20" r="2.2" opacity="0.9" />
    <circle cx="295" cy="60" r="1.5" opacity="0.7" />
    <circle cx="50" cy="130" r="1.2" opacity="0.5" />
    <circle cx="280" cy="130" r="1.4" opacity="0.6" />
  </g>

  <!-- Large Crescent Moon with Glow -->
  <path d="M185 30 C130 30 85 75 85 130 C85 145 88 158 94 170 C80 156 70 135 70 112 C70 65 108 27 155 27 C166 27 176 29 185 33 Z" fill="#f5b726" opacity="0.15" filter="url(#glow)" />
  <path d="M190 28 C132 28 85 75 85 133 C85 148 88 162 95 174 C78 158 68 135 68 110 C68 60 108 20 158 20 C170 20 181 23 190 28 Z" fill="url(#moonGrad)" />

  <!-- Sleeping Sloth Curled on the Crescent Moon -->
  <g transform="translate(105, 55)">
    <!-- Sloth Body -->
    <ellipse cx="45" cy="40" rx="32" ry="24" fill="#64748b" opacity="0.95" />
    <ellipse cx="45" cy="40" rx="30" ry="22" fill="#475569" />
    
    <!-- Cozy Fur Highlights -->
    <path d="M25 36 C35 28 55 28 65 36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Sloth Head (Resting) -->
    <ellipse cx="26" cy="36" rx="16" ry="14" fill="#64748b" />
    <ellipse cx="26" cy="36" rx="14" ry="12" fill="#cbd5e1" opacity="0.9" />

    <!-- Eye Mask -->
    <path d="M16 35 C18 31 22 31 25 35" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <ellipse cx="22" cy="37" rx="3.5" ry="2" fill="#334155" opacity="0.4" />
    
    <!-- Peaceful Closed Eye Arc -->
    <path d="M18 36 Q21 39 24 36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cute Nose & Smile -->
    <ellipse cx="14" cy="39" rx="2.5" ry="1.8" fill="#1e293b" />
    <path d="M13 41 Q15 43 17 41" stroke="#334155" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Sloth Long Claws Embracing Moon -->
    <path d="M48 58 C45 66 38 72 32 75" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M30 73 L27 78 M33 74 L31 80 M36 73 L35 79" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round" />

    <!-- Back Arm Holding Moon -->
    <path d="M60 52 C58 60 52 66 46 70" stroke="#475569" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Soft Zzz Floating -->
    <text x="5" y="16" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f5b726" opacity="0.85">Z</text>
    <text x="14" y="8" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#f5b726" opacity="0.65">z</text>
    <text x="21" y="2" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" fill="#f5b726" opacity="0.45">z</text>
  </g>

  <!-- Ambient Stardust Cluster -->
  <g fill="#f5b726" opacity="0.7">
    <circle cx="100" cy="50" r="1" />
    <circle cx="180" cy="110" r="1.5" />
    <circle cx="195" cy="95" r="1.2" />
    <circle cx="210" cy="120" r="0.8" />
    <circle cx="75" cy="85" r="1" />
  </g>
</svg>
